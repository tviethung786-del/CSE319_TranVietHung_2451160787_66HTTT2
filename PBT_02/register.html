<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Form Đăng ký Tài khoản</title>
</head>
<body>
  <h1>Form Đăng ký Tài khoản E-Commerce</h1>
  <form action="#" method="POST">
    
    <!-- Fieldset 1: Thông tin cá nhân -->
    <fieldset>
      <legend>Thông tin cá nhân</legend>
      
      <label for="fullname">Họ tên:</label>
      <input id="fullname" name="fullname" type="text" placeholder="Nhập họ tên" required minlength="2" maxlength="50"><br><br>
      
      <label for="email">Email:</label>
      <input id="email" name="email" type="email" placeholder="Nhập email" required><br><br>
      
      <label for="phone">Số điện thoại:</label>
      <input id="phone" name="phone" type="tel" placeholder="Nhập số điện thoại" pattern="[0-9]{10}" required><br><br>
      
      <label for="dob">Ngày sinh:</label>
      <input id="dob" name="dob" type="date" placeholder="Chọn ngày sinh" max="<?php echo date('Y-m-d'); ?>" required><br><br>
    </fieldset>
    
    <!-- Fieldset 2: Tài khoản -->
    <fieldset>
      <legend>Tài khoản</legend>
      
      <label for="username">Username:</label>
      <input id="username" name="username" type="text" placeholder="Nhập username" pattern="^[A-Za-z0-9_]{3,20}$" required><br><br>
      
      <label for="password">Password:</label>
      <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" minlength="8" 
             pattern="^(?=.*[A-Z])(?=.*[0-9]).{8,}$" required><br><br>
      
      <label for="confirm_password">Xác nhận Password:</label>
      <input id="confirm_password" name="confirm_password" type="password" placeholder="Nhập lại mật khẩu" minlength="8" 
             pattern="^(?=.*[A-Z])(?=.*[0-9]).{8,}$" required><br><br>
    </fieldset>
    
    <!-- Fieldset 3: Thông tin giao hàng -->
    <fieldset>
      <legend>Thông tin giao hàng</legend>
      
      <label for="city">Thành phố:</label>
      <select id="city" name="city" required>
        <option value="">--Chọn thành phố--</option>
        <option value="hanoi">Hà Nội</option>
        <option value="hcm">TP. Hồ Chí Minh</option>
        <option value="danang">Đà Nẵng</option>
        <option value="haiphong">Hải Phòng</option>
        <option value="cantho">Cần Thơ</option>
      </select><br><br>
      
      <label for="district">Quận/Huyện:</label>
      <select id="district" name="district" required>
        <option value="">--Chọn quận/huyện--</option>
        <option value="quan1">Quận 1</option>
        <option value="quan2">Quận 2</option>
        <option value="quan3">Quận 3</option>
      </select><br><br>
      
      <label for="address">Địa chỉ chi tiết:</label>
      <textarea id="address" name="address" rows="3" placeholder="Nhập địa chỉ chi tiết" required></textarea><br><br>
      
      <label>Giới tính:</label>
      <input type="radio" id="male" name="gender" value="Nam" required>
      <label for="male">Nam</label>
      <input type="radio" id="female" name="gender" value="Nữ">
      <label for="female">Nữ</label>
      <input type="radio" id="other" name="gender" value="Khác">
      <label for="other">Khác</label><br><br>
      
      <input type="checkbox" id="terms" name="terms" required>
      <label for="terms">Tôi đồng ý với điều khoản sử dụng</label><br><br>
    </fieldset>
    
    <!-- Buttons -->
    <button type="submit">Đăng ký</button>
    <button type="reset">Reset</button>
    
  </form>
</body>
</html>
