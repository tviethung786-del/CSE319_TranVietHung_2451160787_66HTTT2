<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang Multimedia - Giới thiệu sản phẩm</title>
</head>
<body>
  <h1>Giới thiệu Sản phẩm E-Commerce</h1>

  <!-- 3 ảnh sản phẩm -->
  <section>
    <h2>Sản phẩm nổi bật</h2>
    <figure>
      <img src="iphone16.jpg" alt="iPhone 16 Pro Max màu Titan" loading="lazy" style="max-width:100%; height:auto;">
      <figcaption>iPhone 16 Pro Max — 25.990.000đ</figcaption>
    </figure>

    <figure>
      <img src="laptop.jpg" alt="Laptop Gaming RTX 4060" loading="lazy" style="max-width:100%; height:auto;">
      <figcaption>Laptop Gaming RTX 4060 — 32.500.000đ</figcaption>
    </figure>

    <figure>
      <img src="headphones.jpg" alt="Tai nghe Bluetooth chống ồn" loading="lazy" style="max-width:100%; height:auto;">
      <figcaption>Tai nghe Bluetooth chống ồn — 2.490.000đ</figcaption>
    </figure>
  </section>

  <!-- Video YouTube -->
  <section>
    <h2>Video giới thiệu sản phẩm</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
            title="YouTube video player" frameborder="0" allowfullscreen></iframe>
  </section>

  <!-- Video nội bộ -->
  <section>
    <h2>Video quảng cáo nội bộ</h2>
    <video controls poster="poster.jpg" style="max-width:100%; height:auto;">
      <source src="promo.mp4" type="video/mp4">
      <source src="promo.webm" type="video/webm">
      Trình duyệt của bạn không hỗ trợ video.
    </video>
  </section>

  <!-- Audio -->
  <section>
    <h2>Nhạc nền giới thiệu</h2>
    <audio controls>
      <source src="background.mp3" type="audio/mpeg">
      <source src="background.ogg" type="audio/ogg">
      Trình duyệt của bạn không hỗ trợ audio.
    </audio>
  </section>

  <!-- SVG -->
  <section>
    <h2>Logo SVG</h2>
    <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="40" fill="blue" />
      <text x="50%" y="55%" text-anchor="middle" fill="white" font-size="20" font-family="Arial">Shop</text>
    </svg>
  </section>

</body>
</html>
