<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trang thử nghiệm Position</title>
<link rel="stylesheet" href="positioning.css">
</head>

<body>

<!-- PHẦN ĐẦU TRANG -->
<header>
    <div class="logo">Cửa Hàng Của Tôi</div>

    <nav>
        <a href="#">Trang chủ</a>
        <a href="#">Sản phẩm</a>
        <a href="#">Liên hệ</a>
    </nav>
</header>


<div class="container">

    <!-- THANH BÊN -->
    <aside class="sidebar">
        <h3>Danh mục</h3>
        <ul>
            <li>Điện thoại</li>
            <li>Laptop</li>
            <li>Phụ kiện</li>
            <li>Gaming</li>
        </ul>
    </aside>


    <!-- NỘI DUNG CHÍNH -->
    <main class="content">

        <div class="product-card">
            <div class="badge">HOT</div>
            <h2>iPhone 15</h2>
            <p>Điện thoại bán chạy nhất</p>
        </div>

        <div class="product-card">
            <div class="badge">HOT</div>
            <h2>MacBook Air</h2>
            <p>Laptop mỏng nhẹ</p>
        </div>

        <div class="product-card">
            <div class="badge">HOT</div>
            <h2>AirPods</h2>
            <p>Tai nghe không dây</p>
        </div>

        <!-- Tạo nhiều card để có thanh cuộn -->
        <div class="product-card"><h2>Sản phẩm</h2></div>
        <div class="product-card"><h2>Sản phẩm</h2></div>
        <div class="product-card"><h2>Sản phẩm</h2></div>
        <div class="product-card"><h2>Sản phẩm</h2></div>

    </main>

</div>


<!-- NÚT LÊN ĐẦU TRANG -->
<button class="scroll-top">↑</button>

</body>
</html>
