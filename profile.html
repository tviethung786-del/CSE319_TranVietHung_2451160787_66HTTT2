<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Validation Test</title>
    <style>
        form { margin: 20px; line-height: 2; }
        input { margin-bottom: 10px; display: block; }
    </style>
</head>
<body>
    <form>
        1. Required: <input type="text" required>
        2. Email: <input type="email" value="abc">
        3. Number (1-10): <input type="number" min="1" max="10" value="15">
        4. Pattern (10 digits): <input type="text" pattern="[0-9]{10}" value="abc123">
        5. Minlength (8): <input type="password" minlength="8" value="123">
        
        <button type="submit">Submit</button>
    </form>
</body>
</html>
